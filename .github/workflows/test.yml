name: test

on:
  workflow_dispatch:
  push:
    branches: [main]
  merge_group:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-go@v2
        with:
          go-version: "1.21"

      # terraform-plugin-testing looks for a CLI on PATH before it downloads
      # one. Installing it here keeps the job off the download path, which
      # fails on an expired signing key in the hc-install version we pin.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # terraform-exec parses CLI output; the wrapper script corrupts it.
          terraform_wrapper: false

      - name: Run Acceptance Tests
        run: |
          make testacc
        env:
          statsig_console_key: ${{ secrets.CONSOLE_API_KEY }}
          statsig_whn_console_key: ${{ secrets.WHN_CONSOLE_API_KEY }}
