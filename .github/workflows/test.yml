name: test

on:
  workflow_dispatch:
  push:
    branches: [main]
  merge_group:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 30
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # terraform-plugin-testing looks for a CLI on PATH before it downloads
      # one. Installing it here keeps the job off the download path, which
      # fails on an expired signing key in the hc-install version we pin.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # terraform-exec parses CLI output; the wrapper script corrupts it.
          terraform_wrapper: false

      - name: Run Acceptance Tests
        run: |
          make testacc
        env:
          statsig_console_key: ${{ secrets.CONSOLE_API_KEY }}
          statsig_whn_console_key: ${{ secrets.WHN_CONSOLE_API_KEY }}
